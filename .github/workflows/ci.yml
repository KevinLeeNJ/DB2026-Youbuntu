name: CI

on:
  pull_request:

permissions:
  contents: read

env:
  RMDB_DIR: .
  BUILD_DIR: build

jobs:
  style:
    name: Style
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install clang-format
        run: sudo apt-get update && sudo apt-get install -y clang-format-18
      - name: Check format
        shell: bash
        run: |
          set -euo pipefail
          files=$(git diff --name-only ${{ github.event.pull_request.base.sha }} ${{ github.event.pull_request.head.sha }} -- src rmdb_client | grep -E '\.(c|cc|cpp|cxx|h|hh|hpp|hxx)$' || true)
          if [ -n "$files" ]; then
            clang-format-18 --dry-run --Werror $files
          fi

  lint:
    name: Lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake flex bison libreadline-dev clang-tidy
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
      - name: Lint changed sources
        shell: bash
        run: |
          set -euo pipefail
          files=$(git diff --name-only ${{ github.event.pull_request.base.sha }} ${{ github.event.pull_request.head.sha }} -- src rmdb_client | grep -E '\.(c|cc|cpp|cxx)$' || true)
          if [ -n "$files" ]; then
            clang-tidy -p build $files
          fi

  build-test-e2e:
    name: Build UnitTest E2E
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake flex bison libreadline-dev ccache python3

      - name: Enable ccache
        uses: hendrikmuhs/ccache-action@v1

      - name: Configure Debug build
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DRMDB_ENABLE_NATIVE_OPTIMIZATIONS=OFF

      - name: Build
        run: cmake --build build --parallel

      - name: Unit tests
        working-directory: build
        run: ctest --output-on-failure

      - name: Reduced TPC-C crash recovery E2E
        run: make benchmark-ci
